name: Update contribution snake

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/contribution-snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate light and Tokyo Night contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: saadshr
          outputs: |
            assets/contribution-snake.svg?color_snake=%238B5CF6&color_dots=%23e9eef5,%23bae6fd,%237dd3fc,%234F8EFF,%236941C6
            assets/contribution-snake-dark.svg?palette=github-dark&color_snake=%23A78BFA&color_dots=%231a1b27,%23233750,%232b597a,%234F8EFF,%2322D3EE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save updated animations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/contribution-snake.svg assets/contribution-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution animations are already up to date."
            exit 0
          fi
          git commit -m "docs: refresh contribution snake animations"
          git push origin HEAD:main
